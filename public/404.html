<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <title>Page not found | Georgio Saliba</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #f7f6f2;
        --fg: #1b1a18;
        --muted: #6f6f6a;
        --line: #e5e3dc;
        --accent: #b84a33;
        --accent-soft: #e8846b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #171614;
          --fg: #edebe6;
          --muted: #9b988f;
          --line: #2f2d29;
          --accent: #ec8f75;
          --accent-soft: #c96a51;
        }
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        background: var(--ink);
        color: var(--fg);
        font: 400 1rem/1.6 Geist, ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { width: 100%; max-width: 36rem; }
      .code { color: var(--muted); font-size: 0.875rem; }
      h1 {
        margin-top: 1.5rem;
        font: 400 clamp(2.75rem, 9vw, 4.5rem)/1.05 "Instrument Serif", Georgia, serif;
      }
      h1 em { color: var(--accent); }
      p.lead { margin-top: 1.25rem; color: var(--muted); font-size: 1.125rem; }
      a.home {
        display: inline-flex;
        gap: 0.6rem;
        margin-top: 2.5rem;
        padding: 0.75rem 1.5rem;
        border-radius: 999px;
        background: var(--fg);
        color: var(--ink);
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
        transition: background-color 0.2s;
      }
      a.home:hover { background: var(--accent); color: #fff; }
      a.home:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>This page doesn't exist <em>yet.</em></h1>
      <p class="lead">The link might be old, or mistyped. Everything lives on one page anyway.</p>
      <a class="home" href="/">Back to the portfolio <span aria-hidden="true">→</span></a>
    </main>
  </body>
</html>
