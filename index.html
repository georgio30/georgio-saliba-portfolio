    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash
      ;(function () {
        var theme
        try { theme = localStorage.getItem('theme') } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.classList.toggle('dark', theme === 'dark')
      })()
      // Same for the language (en / fr / ar): saved choice, else the browser's, else English
      ;(function () {
        var supported = ['en', 'fr', 'ar']
        var lang
        try { lang = localStorage.getItem('lang') } catch (e) {}
        if (supported.indexOf(lang) < 0) lang = (navigator.language || '').slice(0, 2).toLowerCase()
        if (supported.indexOf(lang) < 0) lang = 'en'
        document.documentElement.lang = lang
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'
      })()
    </script>
